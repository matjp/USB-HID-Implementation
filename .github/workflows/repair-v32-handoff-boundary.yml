name: Repair V32 handoff boundary

on:
  push:
    paths:
      - ".github/workflows/repair-v32-handoff-boundary.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Repair UEFI producer handoff
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("efi/xhci_mmio_v32.c")
          s = p.read_text()

          old_root = '''static UINT8 v32_root_port(EFI_DEVICE_PATH_PROTOCOL *path, UINT8 *usb_nodes)
          {
              UINT8 *p = (UINT8 *)path;
              UINT8 root = 0;
              UINT8 count = 0;
              while (p) {
                  EFI_DEVICE_PATH_PROTOCOL *h = (EFI_DEVICE_PATH_PROTOCOL *)p;
                  UINT16 len = (UINT16)h->Length[0] | ((UINT16)h->Length[1] << 8);
                  if (len < sizeof(EFI_DEVICE_PATH_PROTOCOL) || h->Type == 0x7fU)
                      break;
                  if (h->Type == 0x03U && h->SubType == 0x05U && len >= 6U) {
                      root = p[4];
                      ++count;
                      Print(u"DP USB NODE: PORT=%u IF=%u\\r\\n", p[4], p[5]);
                  }
                  p += len;
              }
              *usb_nodes = count;
              return root;
          }
          '''
          new_root = '''/* UEFI discovery producer helper: resolve the selected interface to its
           * parent USB port before ownership is handed to the bridge. */
          static UINT8 v32_root_port(EFI_DEVICE_PATH_PROTOCOL *path)
          {
              UINT8 *p = (UINT8 *)path;
              UINT8 root = 0xffU;
              while (p) {
                  EFI_DEVICE_PATH_PROTOCOL *h = (EFI_DEVICE_PATH_PROTOCOL *)p;
                  UINT16 len = (UINT16)h->Length[0] | ((UINT16)h->Length[1] << 8);
                  if (len < sizeof(EFI_DEVICE_PATH_PROTOCOL) || h->Type == 0x7fU)
                      break;
                  if (h->Type == 0x03U && h->SubType == 0x05U && len >= 6U)
                      root = p[4];
                  p += len;
              }
              return root;
          }
          '''
          if old_root not in s:
              raise SystemExit("expected v32_root_port implementation not found")
          s = s.replace(old_root, new_root, 1)

          s2 = s.replace("static EFI_STATUS v32_discover(EFI_HANDLE image, V32_HANDOFF *h,\n                               EFI_HANDLE *controller)\n", "static EFI_STATUS v32_produce_handoff(EFI_HANDLE image, V32_HANDOFF *h,\n                                      EFI_HANDLE *controller)\n", 1)
          if s2 == s:
              raise SystemExit("expected discovery function declaration not found")
          s = s2

          s2 = s.replace("        UINT8 nodes = 0, root;\n", "        UINT8 root;\n", 1)
          if s2 == s:
              raise SystemExit("expected discovery locals not found")
          s = s2

          old_call = "        root = v32_root_port(path, &nodes);\n        Print(u\"DP ROOT=%u USB-NODES=%u FIRST-TYPE=%02x FIRST-SUB=%02x FIRST-LEN=%u\\r\\n\",\n              root, nodes, path ? ((UINT8 *)path)[0] : 0,\n              path ? ((UINT8 *)path)[1] : 0,\n              path ? (UINT16)((UINT8 *)path)[2] | ((UINT16)((UINT8 *)path)[3] << 8) : 0);\n        if (nodes != 1U) {\n            s = EFI_UNSUPPORTED;\n            v32_fail(u\"DISCOVERY\", u\"DIRECT ROOT PORT\", s);\n            FreePool(usb_handles);\n            return s;\n        }\n"
          new_call = "        root = v32_root_port(path);\n        if (root == 0xffU) {\n            s = EFI_NOT_FOUND;\n            v32_fail(u\"DISCOVERY\", u\"ROOT PORT\", s);\n            FreePool(usb_handles);\n            return s;\n        }\n"
          if old_call not in s:
              raise SystemExit("expected device-path validation block not found")
          s = s.replace(old_call, new_call, 1)

          s2 = s.replace("    s = v32_discover(image, &h, &controller);\n", "    /* Phase A: UEFI discovery producer. Everything below consumes only the\n       completed handoff and controller handle; it performs no USB discovery. */\n    s = v32_produce_handoff(image, &h, &controller);\n", 1)
          if s2 == s:
              raise SystemExit("expected main discovery call not found")
          s = s2

          p.write_text(s)
          PY

      - name: Verify project boundary
        run: |
          set -euxo pipefail
          grep -F 'static EFI_STATUS v32_produce_handoff' efi/xhci_mmio_v32.c
          grep -F 's = v32_produce_handoff(image, &h, &controller);' efi/xhci_mmio_v32.c
          ! grep -F 'nodes != 1U' efi/xhci_mmio_v32.c
          ! grep -F 'DP USB NODE:' efi/xhci_mmio_v32.c
          test "$(grep -Fc 'LibLocateHandle(ByProtocol, &V32_UsbIoGuid' efi/xhci_mmio_v32.c)" -eq 1
          test "$(grep -Fc 'EFI_USB_IO_PROTOCOL' efi/xhci_mmio_v32.c)" -gt 0

      - name: Commit repair and remove helper
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-v32-handoff-boundary.yml
          git add efi/xhci_mmio_v32.c .github/workflows/repair-v32-handoff-boundary.yml
          git diff --cached --check
          git commit -m "V32: keep USB discovery on UEFI handoff producer"
          git push origin HEAD:main
