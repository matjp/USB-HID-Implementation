name: Repair V32 CPU interrupt isolation
on:
  push:
    paths:
      - ".github/workflows/repair-v32-cpu-interrupts.yml"

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add CPU interrupt isolation to V32
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('efi/xhci_mmio_v32.c')
          s = p.read_text()

          marker = '''static void v32_fail(const CHAR16 *stage, const CHAR16 *op, EFI_STATUS s)\n{\n    fail(stage, op, s);\n}\n'''
          insert = marker + '''\nstatic UINT64 v32_disable_cpu_interrupts(void)\n{\n    UINT64 flags;\n    __asm__ __volatile__("pushfq; popq %0; cli" : "=r"(flags) :: "memory");\n    return flags;\n}\n\nstatic void v32_restore_cpu_interrupts(UINT64 flags)\n{\n    if (flags & (1ULL << 9))\n        __asm__ __volatile__("sti" ::: "memory");\n}\n'''
          if marker not in s:
              raise SystemExit('v32_fail marker not found')
          s = s.replace(marker, insert, 1)

          old = '    BOOLEAN disconnected = FALSE, attrs_changed_here = FALSE, refs_cleared = FALSE;\n'
          new = old + '    UINT64 saved_rflags = 0;\n    BOOLEAN cpu_interrupts_disabled = FALSE;\n'
          if old not in s:
              raise SystemExit('state variable marker not found')
          s = s.replace(old, new, 1)

          old = '''    disconnected = TRUE;\n    Print(u"UEFI USB STACK QUIESCED / DISCONNECT=PASS\\r\\n");\n\n    s = v32_pci_match(controller, b.pci_segment, b.pci_bus,\n'''
          new = '''    disconnected = TRUE;\n    Print(u"UEFI USB STACK QUIESCED / DISCONNECT=PASS\\r\\n");\n    saved_rflags = v32_disable_cpu_interrupts();\n    cpu_interrupts_disabled = TRUE;\n\n    s = v32_pci_match(controller, b.pci_segment, b.pci_bus,\n'''
          if old not in s:
              raise SystemExit('disconnect marker not found')
          s = s.replace(old, new, 1)

          old = '''    if (p && disconnected && attrs_changed_here) {\n        ts = uefi_call_wrapper(p->Attributes, 4, p,\n                               EfiPciIoAttributeOperationDisable,\n                               attrs_changed, NULL);\n        if (EFI_ERROR(ts) && !EFI_ERROR(s)) s = ts;\n    }\n    if (EFI_ERROR(s)) {\n'''
          new = '''    if (p && disconnected && attrs_changed_here) {\n        ts = uefi_call_wrapper(p->Attributes, 4, p,\n                               EfiPciIoAttributeOperationDisable,\n                               attrs_changed, NULL);\n        if (EFI_ERROR(ts) && !EFI_ERROR(s)) s = ts;\n    }\n    if (cpu_interrupts_disabled) {\n        v32_restore_cpu_interrupts(saved_rflags);\n        cpu_interrupts_disabled = FALSE;\n    }\n    if (EFI_ERROR(s)) {\n'''
          if old not in s:
              raise SystemExit('teardown marker not found')
          s = s.replace(old, new, 1)

          old = '        Print(u"COMMANDS=2 COMMAND-DOORBELLS=2 CPU-INTERRUPTS=0 / LS+FS ONLY\\r\\n");\n'
          new = '        Print(u"COMMANDS=2 COMMAND-DOORBELLS=2 CPU-INTERRUPT-DELIVERY=DISABLED / LS+FS ONLY\\r\\n");\n'
          if old not in s:
              raise SystemExit('final interrupt output marker not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          git diff --check
          grep -q 'pushfq; popq %0; cli' efi/xhci_mmio_v32.c
          grep -q 'saved_rflags = v32_disable_cpu_interrupts()' efi/xhci_mmio_v32.c
          grep -q 'CPU-INTERRUPT-DELIVERY=DISABLED' efi/xhci_mmio_v32.c
          test "$(grep -c 'LibLocateHandle(ByProtocol, &V32_UsbIoGuid' efi/xhci_mmio_v32.c || true)" = 1
          git add efi/xhci_mmio_v32.c
          git commit -m "Disable CPU interrupt delivery during V32 bridge"
          git push

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-efi.yml/dispatches" \
            -d '{"ref":"main","inputs":{"test_id":"v32","source":"efi/xhci_mmio_v32.c","label":"xHCI V32 / Gate 6 / PORT RESET + ADDRESS DEVICE"}}'
      - name: Remove helper
        run: |
          set -euxo pipefail
          rm -f .github/workflows/repair-v32-cpu-interrupts.yml
          git add .github/workflows/repair-v32-cpu-interrupts.yml
          git commit -m "Remove temporary V32 CPU interrupt repair workflow"
          git push
