name: Build Toshiba V6 EFI

on: [push, workflow_dispatch]

jobs:
  build-v6:
    name: Build BOOTX64.EFI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc binutils unzip file

      - name: Checkout GNU-EFI
        uses: actions/checkout@v4
        with:
          repository: 'ncroxon/gnu-efi'
          path: 'gnu-efi'
          ref: 'master'

      - name: Build GNU-EFI
        run: |
          set -euxo pipefail
          make -C gnu-efi ARCH=x86_64

      - name: Locate GNU-EFI

        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/gnu-efi"
          test -f "$ROOT/gnuefi/elf_x86_64_efi.lds"
          CRT=$(find "$ROOT" -type f -name 'crt0-efi-x86_64.o' -print -quit)
          LIBEFI=$(find "$ROOT" -type f -name 'libefi.a' -print -quit)
          LIBGNUEFI=$(find "$ROOT" -type f -name 'libgnuefi.a' -print -quit)
          INC=$(find "$ROOT" -type f -path '*/inc/efi.h' -print -quit)
          test -n "$CRT"; test -n "$LIBEFI"; test -n "$LIBGNUEFI"; test -n "$INC"
          echo "GNUEFI_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "GNUEFI_CRT=$CRT" >> "$GITHUB_ENV"
          echo "GNUEFI_LIBEFI=$LIBEFI" >> "$GITHUB_ENV"
          echo "GNUEFI_LIBGNUEFI=$LIBGNUEFI" >> "$GITHUB_ENV"
          echo "GNUEFI_INC=$(dirname "$INC")" >> "$GITHUB_ENV"

      - name: Compile V6
        run: |
          set -euxo pipefail
          mkdir -p build/v6
          gcc -I"$GNUEFI_INC" -I"$GNUEFI_INC/x86_64" -I"$GNUEFI_INC/protocol" \
            -fpic -ffreestanding -fno-stack-protector -fno-stack-check \
            -fshort-wchar -mno-red-zone -maccumulate-outgoing-args \
            -DEFI_FUNCTION_WRAPPER -Wall -Wextra -Os \
            -c efi/xhci_mmio_one_read.c -o build/v6/xhci_mmio_one_read.o

      - name: Link V6
        run: |
          set -euxo pipefail
          GNUEFI_DIR=$(dirname "$GNUEFI_CRT")
          ld -shared -Bsymbolic -nostdlib -znocombreloc \
            -L"$(dirname "$GNUEFI_LIBEFI")" \
            -L"$(dirname "$GNUEFI_LIBGNUEFI")" \
            -T"$GNUEFI_ROOT/gnuefi/elf_x86_64_efi.lds" \
            "$GNUEFI_CRT" build/v6/xhci_mmio_one_read.o \
            -o build/v6/BOOTX64-V6.elf -lgnuefi -lefi

      - name: Convert and verify EFI
        run: |
          set -euxo pipefail
          objcopy -j .text -j .sdata -j .data -j .rodata -j .dynamic -j .dynsym \
            -j .rel -j .rela -j .rel.* -j .rela.* -j .reloc \
            --output-target=efi-app-x86_64 --subsystem=10 \
            build/v6/BOOTX64-V6.elf build/v6/BOOTX64.EFI
          file build/v6/BOOTX64.EFI
          objdump -h build/v6/BOOTX64.EFI
          strings -a build/v6/BOOTX64.EFI | grep -F 'xHCI V6'
          strings -a build/v6/BOOTX64.EFI | grep -F 'MMIO[000]='
          strings -a build/v6/BOOTX64.EFI | grep -F 'READ-ONLY / 1 MMIO READ'
          test -s build/v6/BOOTX64.EFI

      - name: Package
        run: |
          set -euxo pipefail
          mkdir -p package/EFI/BOOT
          cp build/v6/BOOTX64.EFI package/EFI/BOOT/BOOTX64.EFI
          cp efi/xhci_mmio_one_read.c package/
          (cd package && zip -qr ../BOOTX64-Toshiba-V6.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: Toshiba-V6-EFI
          path: BOOTX64-Toshiba-V6.zip
          if-no-files-found: error
