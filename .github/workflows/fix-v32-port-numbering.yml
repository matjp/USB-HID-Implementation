name: Repair V32 port numbering

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  repair:
    if: github.sha == 'b2a302c4502395edaabf4a25e1dc433622af6523'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good V32 and apply zero-based UEFI port mapping
        shell: bash
        run: |
          set -euo pipefail
          git checkout 1277b53282bbe88138e8eba78b4a32f631cce61b -- efi/xhci_mmio_v32.c

          python3 - <<'PY'
          from pathlib import Path
          p = Path('efi/xhci_mmio_v32.c')
          s = p.read_text()
          replacements = [
              ('if (root == 0U || nodes != 1U) {',
               'if (nodes != 1U) {'),
              ('UINT32 portsc_off;',
               'UINT32 portsc_off;\n    UINT8 xhci_port = 0U;'),
              ('s = v32_supported_protocol(p, hcc, b.keyboard.root_port, &proto_major, &proto_minor, &slot_type, &reads);',
               'if (b.keyboard.root_port == 0xffU) { s = EFI_UNSUPPORTED; v32_fail(u"PORT", u"ROOT PORT NUMBER", s); goto out; }\n    xhci_port = (UINT8)(b.keyboard.root_port + 1U);\n    s = v32_supported_protocol(p, hcc, xhci_port, &proto_major, &proto_minor, &slot_type, &reads);'),
              ('portsc_off = op + 0x400U + ((UINT32)b.keyboard.root_port - 1U) * 0x10U;',
               'portsc_off = op + 0x400U + ((UINT32)xhci_port - 1U) * 0x10U;'),
              ('b.keyboard.root_port, 0, 0, NULL,',
               'xhci_port, 0, 0, NULL,'),
              ('slot[1] = ((UINT32)b.keyboard.root_port << 16);',
               'slot[1] = ((UINT32)xhci_port << 16);'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing expected source text: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git diff --check
          git diff -- efi/xhci_mmio_v32.c

      - name: Commit source repair and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-v32-port-numbering.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add efi/xhci_mmio_v32.c .github/workflows/fix-v32-port-numbering.yml
          git commit -m 'Fix V32 UEFI-to-xHCI root port numbering'
          git push origin HEAD:main

      - name: Dispatch EFI build workflow for repaired source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-efi.yml/dispatches" \
            -d '{"ref":"main"}'
