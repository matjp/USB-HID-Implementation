name: V32 compile diagnostic
on:
  push:
    branches: [main]
    paths:
      - "efi/xhci_mmio_v32.c"
      - ".github/workflows/v32-compile-debug.yml"
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc binutils
      - name: Checkout GNU-EFI
        uses: actions/checkout@v4
        with:
          repository: ncroxon/gnu-efi
          path: gnu-efi
          ref: master
      - name: Build GNU-EFI
        run: make -C gnu-efi ARCH=x86_64
      - name: Compile V32
        run: |
          set +e
          ROOT="$GITHUB_WORKSPACE/gnu-efi"
          INC=$(find "$ROOT" -type f -path '*/inc/efi.h' -print -quit)
          GNUEFI_INC=$(dirname "$INC")
          mkdir -p build
          gcc -I"$GITHUB_WORKSPACE/efi" -I"$GNUEFI_INC" -I"$GNUEFI_INC/x86_64" -I"$GNUEFI_INC/protocol" -fpic -ffreestanding -fno-stack-protector -fno-stack-check -fshort-wchar -mno-red-zone -maccumulate-outgoing-args -DEFI_FUNCTION_WRAPPER -Wall -Wextra -Os -c efi/xhci_mmio_v32.c -o build/v32.o >build/compile.log 2>&1
          rc=$?
          cat build/compile.log
          exit $rc
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: v32-compile-diagnostic
          path: build/compile.log
          if-no-files-found: error
