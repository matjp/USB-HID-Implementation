name: V32 discovery diagnostics

on:
  push:
    paths:
      - 'efi/xhci_mmio_v32.c'
      - '.github/workflows/v32-discovery-debug.yml'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'V32 discovery diagnostics')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add discovery diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('efi/xhci_mmio_v32.c')
          s = p.read_text()
          old = '''    s = LibLocateHandle(ByProtocol, &UsbIoGuid, NULL, &n, &hs);\n    if (EFI_ERROR(s)) return EFI_NOT_FOUND;\n'''
          new = '''    s = LibLocateHandle(ByProtocol, &UsbIoGuid, NULL, &n, &hs);\n    if (EFI_ERROR(s)) return EFI_NOT_FOUND;\n    Print(u"DISC USBIO HANDLES=%u\\r\\n", n);\n'''
          if old not in s: raise SystemExit('locate anchor not found')
          s = s.replace(old, new, 1)
          old = '''        if (in.InterfaceClass != USB_CLASS_HID || in.InterfaceSubClass != HID_SUBCLASS_BOOT ||\n            in.InterfaceProtocol != HID_PROTOCOL_KEYBOARD) continue;\n        if (EFI_ERROR(uefi_call_wrapper(usb->UsbGetDeviceDescriptor, 2, usb, &dd))) continue;\n        path = DevicePathFromHandle(hs[i]);\n        port = root_port(path, &usb_nodes);\n        if (!port || usb_nodes != 1U || !path_last_pci_bdf(path, &pci_dev, &pci_fun)) continue;\n'''
          new = '''        if (in.InterfaceClass != USB_CLASS_HID || in.InterfaceSubClass != HID_SUBCLASS_BOOT ||\n            in.InterfaceProtocol != HID_PROTOCOL_KEYBOARD) continue;\n        Print(u"DISC HID i=%u IF=%u EPs=%u\\r\\n", i, in.InterfaceNumber, in.NumEndpoints);\n        if (EFI_ERROR(uefi_call_wrapper(usb->UsbGetDeviceDescriptor, 2, usb, &dd))) {\n            Print(u"DISC REJECT i=%u DEVICE DESCRIPTOR\\r\\n");\n            continue;\n        }\n        path = DevicePathFromHandle(hs[i]);\n        port = root_port(path, &usb_nodes);\n        if (!port || usb_nodes != 1U || !path_last_pci_bdf(path, &pci_dev, &pci_fun)) {\n            Print(u"DISC REJECT i=%u PORT=%u USBNODES=%u BDF=%s\\r\\n",\n                  i, port, usb_nodes, path_last_pci_bdf(path, &pci_dev, &pci_fun) ? u"YES" : u"NO");\n            continue;\n        }\n        Print(u"DISC PATH i=%u PORT=%u USBNODES=%u BDF=%02x:%u\\r\\n",\n              i, port, usb_nodes, pci_dev, pci_fun);\n'''
          if old not in s: raise SystemExit('candidate anchor not found')
          s = s.replace(old, new, 1)
          old = '''        if (!d->endpoint) continue;\n'''
          new = '''        if (!d->endpoint) {\n            Print(u"DISC REJECT i=%u NO INTERRUPT-IN\\r\\n", i);\n            continue;\n        }\n'''
          if old not in s: raise SystemExit('endpoint anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove debug workflow after patch
        run: rm -f .github/workflows/v32-discovery-debug.yml
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add efi/xhci_mmio_v32.c .github/workflows/v32-discovery-debug.yml
          git commit -m 'V32 discovery diagnostics' || exit 0
          git push
