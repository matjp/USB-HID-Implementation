name: Repair V32 slot state validation
on:
  push:
    paths:
      - ".github/workflows/repair-v32-slot-state.yml"

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Slot Context state validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('efi/xhci_mmio_v32.c')
          s = p.read_text()
          old = '        UINT32 d3 = out_slot[(stride / 4U) * 3U];\n'
          new = '        UINT32 d3 = out_slot[3];\n'
          if old not in s:
              raise SystemExit('Slot Context validation expression not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          grep -q 'UINT32 d3 = out_slot\[3\];' efi/xhci_mmio_v32.c
          git add efi/xhci_mmio_v32.c
          git commit -m "Fix V32 Slot Context state validation"
          git push

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-efi.yml/dispatches" \
            -d '{"ref":"main","inputs":{"test_id":"v32","source":"efi/xhci_mmio_v32.c","label":"xHCI V32 / Gate 6 / PORT RESET + ADDRESS DEVICE"}}'
      - name: Remove helper
        run: |
          set -euxo pipefail
          rm -f .github/workflows/repair-v32-slot-state.yml
          git add .github/workflows/repair-v32-slot-state.yml
          git commit -m "Remove temporary V32 slot-state repair workflow"
          git push
