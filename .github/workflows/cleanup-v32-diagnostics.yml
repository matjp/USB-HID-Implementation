name: Clean V32 diagnostics
on:
  push:
    paths:
      - ".github/workflows/cleanup-v32-diagnostics.yml"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary diagnostics
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('efi/xhci_mmio_v32.c')
          s = p.read_text()
          pattern = re.compile(
              r'\n    \{\n'
              r'        UINT32 after_reset = 0;\n'
              r'.*?'
              r'    \}\n'
              r'    Print\(u"PORT RESET: ASSERTED / WAITING\\r\\n"\);',
              re.S)
          replacement = '\n    Print(u"PORT RESET: ASSERTED / WAITING\\r\\n");'
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('V32 temporary reset diagnostics not found')
          p.write_text(s2)
          PY
          git diff --check
          ! grep -q 'RESET OBSERVE:' efi/xhci_mmio_v32.c
          ! grep -q 'EVENT\[0\]:' efi/xhci_mmio_v32.c
          grep -q 'static EFI_STATUS v32_produce_handoff' efi/xhci_mmio_v32.c
          grep -q 'UINT32 \*erst32 = (UINT32 \*)erst' efi/xhci_mmio_v32.c
          grep -q 'UINT32 d3 = out_slot\[3\]' efi/xhci_mmio_v32.c
          grep -q '#define V32_USB_SPEED_FULL          1U' efi/xhci_mmio_v32.c
          grep -q '#define V32_USB_SPEED_LOW           2U' efi/xhci_mmio_v32.c
          test "$(grep -c 'LibLocateHandle(ByProtocol, &V32_UsbIoGuid' efi/xhci_mmio_v32.c || true)" = 1
          git add efi/xhci_mmio_v32.c
          git commit -m "Remove temporary V32 reset diagnostics"
          git push
      - name: Remove helper
        run: |
          set -euxo pipefail
          rm -f .github/workflows/cleanup-v32-diagnostics.yml
          git add .github/workflows/cleanup-v32-diagnostics.yml
          git commit -m "Remove temporary V32 diagnostics workflow"
          git push
