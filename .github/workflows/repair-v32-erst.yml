name: Repair V32 ERST layout
on:
  push:
    paths:
      - ".github/workflows/repair-v32-erst.yml"

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair V32 ERST and remove diagnostics
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('efi/xhci_mmio_v32.c')
          s = p.read_text()

          old = '''        {\n            UINT32 after_reset = 0;\n            s = mr32(p, portsc_off, &after_reset); ++reads;\n            if (EFI_ERROR(s)) goto out;\n            Print(u"RESET OBSERVE: PR=%u PRC=%u PED=%u PLS=%u SPEED=%u\\r\\n",\n                  (after_reset & V32_PORTSC_PR) ? 1U : 0U,\n                  (after_reset & V32_PORTSC_PRC) ? 1U : 0U,\n                  (after_reset & V32_PORTSC_PED) ? 1U : 0U,\n                  (after_reset & V32_PORTSC_PLS_MASK) >> 5,\n                  (after_reset & V32_PORTSC_SPEED_MASK) >> V32_PORTSC_SPEED_SHIFT);\n            {\n                volatile UINT32 *ev = (volatile UINT32 *)ev_d.host;\n                Print(u"EVENT[0]: %08x %08x %08x %08x\\r\\n", ev[0], ev[1], ev[2], ev[3]);\n            }\n        }\n        Print(u"PORT RESET: ASSERTED / WAITING\\r\\n");\n'''
          new = '''    Print(u"PORT RESET: ASSERTED / WAITING\\r\\n");\n'''
          if old not in s:
              raise SystemExit('temporary reset diagnostic block not found')
          s = s.replace(old, new, 1)

          old = '''    erst[0] = ev_d.dev; erst[1] = 0; erst[2] = EVENT_TRBS; erst[3] = 0;\n'''
          new = '''    {\n        UINT32 *erst32 = (UINT32 *)erst;\n        erst32[0] = (UINT32)ev_d.dev;\n        erst32[1] = (UINT32)(ev_d.dev >> 32);\n        erst32[2] = EVENT_TRBS;\n        erst32[3] = 0U;\n    }\n'''
          if old not in s:
              raise SystemExit('ERST initialization pattern not found')
          s = s.replace(old, new, 1)

          old = '#define V32_USB_SPEED_FULL          1U\n#define V32_USB_SPEED_LOW           2U'
          if old not in s:
              raise SystemExit('correct speed encoding not present')

          p.write_text(s)
          PY
          git diff --check
          grep -q 'erst32\[2\] = EVENT_TRBS' efi/xhci_mmio_v32.c
          ! grep -q 'RESET OBSERVE:' efi/xhci_mmio_v32.c
          ! grep -q 'EVENT\[0\]:' efi/xhci_mmio_v32.c
          grep -q '#define V32_USB_SPEED_FULL          1U' efi/xhci_mmio_v32.c
          grep -q '#define V32_USB_SPEED_LOW           2U' efi/xhci_mmio_v32.c
          git add efi/xhci_mmio_v32.c
          git commit -m "Fix V32 event ring segment table layout"
          git push
      - name: Remove helper workflow
        run: |
          set -euxo pipefail
          rm -f .github/workflows/repair-v32-erst.yml
          git add .github/workflows/repair-v32-erst.yml
          git commit -m "Remove temporary V32 ERST repair workflow"
          git push
