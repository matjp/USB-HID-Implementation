name: Dispatch V32 build
on:
  push:
    paths:
      - ".github/workflows/dispatch-v32-build.yml"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dispatch Build EFI Test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-efi.yml/dispatches" \
            -d '{"ref":"main","inputs":{"test_id":"v32","source":"efi/xhci_mmio_v32.c","label":"xHCI V32 / Gate 6 / PORT RESET + ADDRESS DEVICE"}}'
      - name: Remove helper workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/dispatch-v32-build.yml
          git add .github/workflows/dispatch-v32-build.yml
          git commit -m "Remove temporary V32 build dispatcher"
          git push
