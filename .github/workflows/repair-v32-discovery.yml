name: Repair V32 discovery

on:
  push:
    paths:
      - .github/repair-v32-discovery

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove unnecessary UEFI config-descriptor dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("efi/xhci_mmio_v32.c")
          s = p.read_text()
          old = '        EFI_USB_CONFIG_DESCRIPTOR cd;\n'
          assert s.count(old) == 1, "config descriptor declaration not found exactly once"
          s = s.replace(old, "")
          old = '        if (EFI_ERROR(uefi_call_wrapper(usb->UsbGetConfigDescriptor, 2, usb, &cd))) continue;\n'
          assert s.count(old) == 1, "config descriptor call not found exactly once"
          s = s.replace(old, "")
          old = '        d->config = cd.ConfigurationValue;\n'
          assert s.count(old) == 1, "config assignment not found exactly once"
          s = s.replace(old, '        d->config = 0;\n')
          p.write_text(s)
          PY
          git diff --check
          grep -n "UsbGetConfigDescriptor" efi/xhci_mmio_v32.c && exit 1 || true

      - name: Remove temporary repair machinery
        run: |
          rm -f .github/repair-v32-discovery
          rm -f .github/workflows/repair-v32-discovery.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add efi/xhci_mmio_v32.c .github/repair-v32-discovery .github/workflows/repair-v32-discovery.yml
          git commit -m "Fix V32 UEFI keyboard discovery dependency"
          git push
