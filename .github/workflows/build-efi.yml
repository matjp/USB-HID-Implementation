name: Build EFI Test
# EFI source provenance is tracked separately from workflow/documentation commits.
# V28 compatibility header is maintained under efi/usb_io_compat.h.

on:
  push:
    branches: [main]
    paths:
      - "efi/xhci_mmio_v32.c"
      - ".github/workflows/build-efi.yml"
  workflow_dispatch:
    inputs:
      test_id:
        description: "Artifact/test identifier"
        required: true
        default: "v32"
        type: string
      source:
        description: "EFI C source path"
        required: true
        default: "efi/xhci_mmio_v32.c"
        type: string
      label:
        description: "Human-readable test label"
        required: true
        default: "xHCI V32 / Gate 6 / PORT RESET + ADDRESS DEVICE"
        type: string

concurrency:
  group: build-efi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    name: Build EFI test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEST_ID: ${{ inputs.test_id || 'v32' }}
      SOURCE: ${{ inputs.source || 'efi/xhci_mmio_v32.c' }}
      LABEL: ${{ inputs.label || 'xHCI V32 / Gate 6 / PORT RESET + ADDRESS DEVICE' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc binutils file qemu-system-x86 ovmf mtools xvfb imagemagick

      - name: Validate test inputs
        run: |
          set -euxo pipefail
          case "$TEST_ID" in *..*|*/*|*\*) exit 1;; esac
          case "$SOURCE" in efi/*.c) ;; *) exit 1;; esac
          test -f "$SOURCE"

      - name: Checkout GNU-EFI
        uses: actions/checkout@v4
        with:
          repository: ncroxon/gnu-efi
          path: gnu-efi
          ref: master

      - name: Build GNU-EFI
        run: make -C gnu-efi ARCH=x86_64

      - name: Locate GNU-EFI
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/gnu-efi"
          test -f "$ROOT/gnuefi/elf_x86_64_efi.lds"
          CRT=$(find "$ROOT" -type f -name 'crt0-efi-x86_64.o' -print -quit)
          LIBEFI=$(find "$ROOT" -type f -name 'libefi.a' -print -quit)
          LIBGNUEFI=$(find "$ROOT" -type f -name 'libgnuefi.a' -print -quit)
          INC=$(find "$ROOT" -type f -path '*/inc/efi.h' -print -quit)
          test -n "$CRT"; test -n "$LIBEFI"; test -n "$LIBGNUEFI"; test -n "$INC"
          echo "GNUEFI_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "GNUEFI_CRT=$CRT" >> "$GITHUB_ENV"
          echo "GNUEFI_LIBEFI=$LIBEFI" >> "$GITHUB_ENV"
          echo "GNUEFI_LIBGNUEFI=$LIBGNUEFI" >> "$GITHUB_ENV"
          echo "GNUEFI_INC=$(dirname "$INC")" >> "$GITHUB_ENV"

      - name: Record build provenance
        run: |
          set -euxo pipefail
          mkdir -p "build/$TEST_ID"
          BUILD_SHA="$(git rev-parse HEAD)"
          if [ "$BUILD_SHA" != "$GITHUB_SHA" ]; then echo "ERROR: checkout commit does not match GITHUB_SHA." >&2; exit 1; fi
          git ls-files --error-unmatch -- "$SOURCE" >/dev/null 2>&1 || { echo "ERROR: source not tracked: $SOURCE" >&2; exit 1; }
          EFI_COMMIT="$(git log -1 --format=%H -- "$SOURCE")"
          SOURCE_SHA256="$(sha256sum "$SOURCE" | cut -d' ' -f1)"
          test -n "$EFI_COMMIT"
          printf 'BUILD_COMMIT=%s\nEFI_COMMIT=%s\nSOURCE_PATH=%s\nSOURCE_SHA256=%s\nTEST_ID=%s\n' "$BUILD_SHA" "$EFI_COMMIT" "$SOURCE" "$SOURCE_SHA256" "$TEST_ID" > "build/$TEST_ID/BUILD-PROVENANCE.txt"
          cat "build/$TEST_ID/BUILD-PROVENANCE.txt"

      - name: Compile
        run: |
          set -euxo pipefail
          gcc -I"$GITHUB_WORKSPACE/efi" -I"$GNUEFI_INC" -I"$GNUEFI_INC/x86_64" -I"$GNUEFI_INC/protocol" -fpic -ffreestanding -fno-stack-protector -fno-stack-check -fshort-wchar -mno-red-zone -maccumulate-outgoing-args -DEFI_FUNCTION_WRAPPER -Wall -Wextra -Os -c "$SOURCE" -o "build/$TEST_ID/test.o"

      - name: Verify source used for compile
        run: |
          set -euxo pipefail
          COMPILED_SHA256="$(sha256sum "$SOURCE" | cut -d' ' -f1)"
          grep -Fx "SOURCE_SHA256=$COMPILED_SHA256" "build/$TEST_ID/BUILD-PROVENANCE.txt"
          test "$(git log -1 --format=%H -- "$SOURCE")" = "$(grep '^EFI_COMMIT=' "build/$TEST_ID/BUILD-PROVENANCE.txt" | cut -d= -f2-)"

      - name: Link
        run: |
          set -euxo pipefail
          ld -shared -Bsymbolic -nostdlib -znocombreloc -L"$(dirname "$GNUEFI_LIBEFI")" -L"$(dirname "$GNUEFI_LIBGNUEFI")" -T"$GNUEFI_ROOT/gnuefi/elf_x86_64_efi.lds" "$GNUEFI_CRT" "build/$TEST_ID/test.o" -o "build/$TEST_ID/BOOTX64-$TEST_ID.elf" -lgnuefi -lefi

      - name: Convert and verify EFI
        run: |
          set -euxo pipefail
          objcopy -j .text -j .sdata -j .data -j .rodata -j .dynamic -j .dynsym -j .rel -j .rela -j .rel.* -j .rela.* -j .reloc --output-target=efi-app-x86_64 --subsystem=10 "build/$TEST_ID/BOOTX64-$TEST_ID.elf" "build/$TEST_ID/BOOTX64.EFI"
          file "build/$TEST_ID/BOOTX64.EFI"
          objdump -h "build/$TEST_ID/BOOTX64.EFI"
          test -s "build/$TEST_ID/BOOTX64.EFI"

      - name: QEMU UEFI boot verification
        run: |
          set -euxo pipefail
          WORK="build/$TEST_ID/qemu"
          ESP="$WORK/ESP"
          QMP="$WORK/qmp.sock"
          SCREEN="$WORK/qemu-screen.png"
          SCREEN_AFTER="$WORK/qemu-after-key.png"
          OVMF_CODE="$(find /usr/share/OVMF /usr/share/edk2* -type f -name 'OVMF_CODE*.fd' -print -quit 2>/dev/null || true)"
          OVMF_VARS="$(find /usr/share/OVMF /usr/share/edk2* -type f -name 'OVMF_VARS*.fd' -print -quit 2>/dev/null || true)"
          test -n "$OVMF_CODE"; test -n "$OVMF_VARS"
          mkdir -p "$ESP/EFI/BOOT"
          cp "build/$TEST_ID/BOOTX64.EFI" "$ESP/EFI/BOOT/BOOTX64.EFI"
          cp "$OVMF_VARS" "$WORK/OVMF_VARS.fd"

          cat > "$WORK/qmp.py" <<'PY'
          import json, socket, sys, time
          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          deadline = time.time() + 8
          while True:
              try:
                  sock.connect(sys.argv[1])
                  break
              except OSError:
                  if time.time() >= deadline:
                      raise
                  time.sleep(0.1)
          sock.recv(4096)
          def cmd(obj):
              sock.sendall((json.dumps(obj) + "\r\n").encode())
              return sock.recv(4096)
          cmd({"execute":"qmp_capabilities"})
          cmd({"execute":"human-monitor-command", "arguments":{"command-line":"sendkey ret"}})
          time.sleep(1)
          cmd({"execute":"quit"})
          sock.close()
          PY

          Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
          export DISPLAY=:99

          qemu-system-x86_64 \
            -machine q35 \
            -m 512M \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file="$WORK/OVMF_VARS.fd" \
            -drive file=fat:rw:"$ESP",format=raw \
            -device qemu-xhci,id=xhci \
            -device usb-kbd,bus=xhci.0 \
            -display gtk \
            -qmp "unix:$QMP,server=on,wait=off" \
            -no-reboot -no-shutdown >/tmp/qemu.log 2>&1 &
          QEMU_PID=$!

          for _ in $(seq 1 80); do
            if [ -S "$QMP" ]; then break; fi
            sleep 0.1
          done
          sleep 5
          import -display "$DISPLAY" -window root "$SCREEN"
          test -s "$SCREEN"

          python3 "$WORK/qmp.py" "$QMP"
          sleep 1
          import -display "$DISPLAY" -window root "$SCREEN_AFTER"
          test -s "$SCREEN_AFTER"

          wait "$QEMU_PID" || true
          cp /tmp/qemu.log "$WORK/qemu.log" || true
          cp /tmp/xvfb.log "$WORK/xvfb.log" || true

      - name: Prepare artifact
        run: |
          set -euxo pipefail
          mkdir -p "artifact/EFI-$TEST_ID"
          cp "build/$TEST_ID/BOOTX64.EFI" "artifact/EFI-$TEST_ID/BOOTX64.EFI"
          cp "build/$TEST_ID/BUILD-PROVENANCE.txt" "artifact/EFI-$TEST_ID/BUILD-PROVENANCE.txt"
          cp "$SOURCE" "artifact/EFI-$TEST_ID/$TEST_ID.c"
          cp "build/$TEST_ID/qemu/qemu-screen.png" "artifact/EFI-$TEST_ID/QEMU-SCREEN-BEFORE-KEY.png"
          cp "build/$TEST_ID/qemu/qemu-after-key.png" "artifact/EFI-$TEST_ID/QEMU-SCREEN-AFTER-KEY.png"
          cp "build/$TEST_ID/qemu/qemu.log" "artifact/EFI-$TEST_ID/QEMU.log"
          test -s "artifact/EFI-$TEST_ID/BOOTX64.EFI"
          test -s "artifact/EFI-$TEST_ID/BUILD-PROVENANCE.txt"
          test -s "artifact/EFI-$TEST_ID/QEMU-SCREEN-BEFORE-KEY.png"
          test -s "artifact/EFI-$TEST_ID/QEMU-SCREEN-AFTER-KEY.png"

      - uses: actions/upload-artifact@v4
        with:
          name: EFI-${{ env.TEST_ID }}
          path: artifact/EFI-${{ env.TEST_ID }}
          if-no-files-found: error
