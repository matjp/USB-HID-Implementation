name: Build EFI Test
# EFI source provenance is tracked separately from workflow/documentation commits.
# V28 compatibility header is maintained under efi/usb_io_compat.h.

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: "Artifact/test identifier"
        required: true
        default: "v32.4"
        type: string
      source:
        description: "EFI C source path"
        required: true
        default: "efi/xhci_mmio_v32.4.c"
        type: string
      label:
        description: "Human-readable test label"
        required: true
        default: "xHCI V32.4 / PAGED PORT STATE DIAGNOSTIC"
        type: string

concurrency:
  group: build-efi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Build ') }}
    name: Build EFI test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEST_ID: ${{ inputs.test_id || 'v32.4' }}
      SOURCE: ${{ inputs.source || 'efi/xhci_mmio_v32.4.c' }}
      LABEL: ${{ inputs.label || 'xHCI V32.4 / PAGED PORT STATE DIAGNOSTIC' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc binutils file

      - name: Validate test inputs
        run: |
          set -euxo pipefail
          case "$TEST_ID" in *..*|*/*|*\*) exit 1;; esac
          case "$SOURCE" in efi/*.c) ;; *) exit 1;; esac
          test -f "$SOURCE"

      - name: Checkout GNU-EFI
        uses: actions/checkout@v4
        with:
          repository: ncroxon/gnu-efi
          path: gnu-efi
          ref: master

      - name: Build GNU-EFI
        run: make -C gnu-efi ARCH=x86_64

      - name: Locate GNU-EFI
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/gnu-efi"
          test -f "$ROOT/gnuefi/elf_x86_64_efi.lds"
          CRT=$(find "$ROOT" -type f -name 'crt0-efi-x86_64.o' -print -quit)
          LIBEFI=$(find "$ROOT" -type f -name 'libefi.a' -print -quit)
          LIBGNUEFI=$(find "$ROOT" -type f -name 'libgnuefi.a' -print -quit)
          INC=$(find "$ROOT" -type f -path '*/inc/efi.h' -print -quit)
          test -n "$CRT"; test -n "$LIBEFI"; test -n "$LIBGNUEFI"; test -n "$INC"
          echo "GNUEFI_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "GNUEFI_CRT=$CRT" >> "$GITHUB_ENV"
          echo "GNUEFI_LIBEFI=$LIBEFI" >> "$GITHUB_ENV"
          echo "GNUEFI_LIBGNUEFI=$LIBGNUEFI" >> "$GITHUB_ENV"
          echo "GNUEFI_INC=$(dirname "$INC")" >> "$GITHUB_ENV"

      - name: Record build provenance
        run: |
          set -u
          mkdir -p "build/$TEST_ID"
          BUILD_SHA="$(git rev-parse HEAD)"
          if [ "$BUILD_SHA" != "$GITHUB_SHA" ]; then echo "ERROR: checkout commit does not match GITHUB_SHA." >&2; exit 1; fi
          git ls-files --error-unmatch -- "$SOURCE" >/dev/null 2>&1 || { echo "ERROR: source not tracked: $SOURCE" >&2; exit 1; }
          EFI_COMMIT="$(git log -1 --format=%H -- "$SOURCE")"
          test -n "$EFI_COMMIT"
          V32_3_COMMIT="$(git log -1 --format=%H -- efi/xhci_mmio_v32.3.c)"
          test -n "$V32_3_COMMIT"
          printf 'BUILD_COMMIT=%s\nEFI_COMMIT=%s\nSOURCE_PATH=%s\nV32_3_DEPENDENCY_COMMIT=%s\nV32_3_DEPENDENCY_PATH=efi/xhci_mmio_v32.3.c\nTEST_ID=%s\n' "$BUILD_SHA" "$EFI_COMMIT" "$SOURCE" "$V32_3_COMMIT" "$TEST_ID" > "build/$TEST_ID/BUILD-PROVENANCE.txt"
          cat "build/$TEST_ID/BUILD-PROVENANCE.txt"

      - name: Prepare V32.3 runtime-offset source
        run: |
          set -euxo pipefail
          cp efi/xhci_mmio_v32.3.c "build/$TEST_ID/xhci_mmio_v32.3_patched.c"
          python3 - "build/$TEST_ID/xhci_mmio_v32.3_patched.c" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          old = """    UINT32 status = 0, maxslots = 0, pagesize = 0;\n"""
          new = """    UINT32 status = 0, maxslots = 0, pagesize = 0;\n    UINT32 rtsoff = 0, xhci_rt = 0;\n"""
          if text.count(old) != 1:
              raise SystemExit("unexpected status declaration count")
          text = text.replace(old, new)

          old = """    s = mr32(p, 0x10, &hcc);\n    if (EFI_ERROR(s) || !(hcc & HCC_AC64)) { s = EFI_UNSUPPORTED; goto out; }\n"""
          new = """    s = mr32(p, 0x10, &hcc);\n    if (EFI_ERROR(s) || !(hcc & HCC_AC64)) { s = EFI_UNSUPPORTED; goto out; }\n    s = mr32(p, 0x18, &rtsoff);\n    if (EFI_ERROR(s)) goto out;\n    xhci_rt = rtsoff & ~0x1fU;\n"""
          if text.count(old) != 1:
              raise SystemExit("unexpected HCC block count")
          text = text.replace(old, new)

          old = """    Print(u\"xHCI VERSION=%u.%02u PCI=%04x:%04x BAR=%08x/%08x OPBASE=%02x\\r\\n\",\n          ver >> 8, ver & 0xffU, id & 0xffffU, id >> 16, bar0, bar1, op);\n"""
          new = """    Print(u\"xHCI VERSION=%u.%02u PCI=%04x:%04x BAR=%08x/%08x OPBASE=%02x RTSOFF=%08x\\r\\n\",\n          ver >> 8, ver & 0xffU, id & 0xffffU, id >> 16, bar0, bar1, op, rtsoff);\n"""
          if text.count(old) != 1:
              raise SystemExit("unexpected controller info print count")
          text = text.replace(old, new)

          replacements = {
              "mw32(p, 0x20 + 0x08, 1U)": "mw32(p, xhci_rt + 0x08, 1U)",
              "mw64(p, 0x20 + 0x18, ev_d.dev | 8ULL)": "mw64(p, xhci_rt + 0x18, ev_d.dev | 8ULL)",
              "mw64(p, 0x20 + 0x10, erst_d.dev)": "mw64(p, xhci_rt + 0x10, erst_d.dev)",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected runtime access count: {old}")
              text = text.replace(old, new)

          path.write_text(text)
          PY
          grep -F 'xhci_rt + 0x08' "build/$TEST_ID/xhci_mmio_v32.3_patched.c"
          grep -F 'xhci_rt + 0x18' "build/$TEST_ID/xhci_mmio_v32.3_patched.c"
          grep -F 'xhci_rt + 0x10' "build/$TEST_ID/xhci_mmio_v32.3_patched.c"

      - name: Compile
        run: |
          set -euxo pipefail
          gcc -I"$GITHUB_WORKSPACE/build/$TEST_ID" -I"$GNUEFI_INC" -I"$GNUEFI_INC/x86_64" -I"$GNUEFI_INC/protocol" -fpic -ffreestanding -fno-stack-protector -fno-stack-check -fshort-wchar -mno-red-zone -maccumulate-outgoing-args -DEFI_FUNCTION_WRAPPER -Wall -Wextra -Os -c "$SOURCE" -o "build/$TEST_ID/test.o"

      - name: Link
        run: |
          set -euxo pipefail
          ld -shared -Bsymbolic -nostdlib -znocombreloc -L"$(dirname "$GNUEFI_LIBEFI")" -L"$(dirname "$GNUEFI_LIBGNUEFI")" -T"$GNUEFI_ROOT/gnuefi/elf_x86_64_efi.lds" "$GNUEFI_CRT" "build/$TEST_ID/test.o" -o "build/$TEST_ID/BOOTX64-$TEST_ID.elf" -lgnuefi -lefi

      - name: Convert and verify EFI
        run: |
          set -euxo pipefail
          objcopy -j .text -j .sdata -j .data -j .rodata -j .dynamic -j .dynsym -j .rel -j .rela -j .rel.* -j .rela.* -j .reloc --output-target=efi-app-x86_64 --subsystem=10 "build/$TEST_ID/BOOTX64-$TEST_ID.elf" "build/$TEST_ID/BOOTX64.EFI"
          file "build/$TEST_ID/BOOTX64.EFI"
          objdump -h "build/$TEST_ID/BOOTX64.EFI"
          test -s "build/$TEST_ID/BOOTX64.EFI"

      - name: Prepare artifact
        run: |
          set -euxo pipefail
          mkdir -p "artifact/EFI-$TEST_ID"
          cp "build/$TEST_ID/BOOTX64.EFI" "artifact/EFI-$TEST_ID/BOOTX64.EFI"
          cp "build/$TEST_ID/BUILD-PROVENANCE.txt" "artifact/EFI-$TEST_ID/BUILD-PROVENANCE.txt"
          test -s "artifact/EFI-$TEST_ID/BOOTX64.EFI"
          test -s "artifact/EFI-$TEST_ID/BUILD-PROVENANCE.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: EFI-${{ env.TEST_ID }}
          path: artifact/EFI-${{ env.TEST_ID }}
          if-no-files-found: error
