name: Build EFI Test
# EFI source provenance is tracked separately from workflow/documentation commits.
# V28 compatibility header is maintained under efi/usb_io_compat.h.

on:
  workflow_dispatch:
    inputs:
      test_id:
        description: "Artifact/test identifier"
        required: true
        default: "v31"
        type: string
      source:
        description: "EFI C source path"
        required: true
        default: "efi/xhci_mmio_v31.c"
        type: string
      label:
        description: "Human-readable test label"
        required: true
        default: "xHCI V31 / ENABLE SLOT COMMAND + COMPLETION"
        type: string

concurrency:
  group: build-efi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Build ') }}
    name: Build EFI test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEST_ID: ${{ inputs.test_id || 'v31' }}
      SOURCE: ${{ inputs.source || 'efi/xhci_mmio_v31.c' }}
      LABEL: ${{ inputs.label || 'xHCI V31 / ENABLE SLOT COMMAND + COMPLETION' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc binutils file

      - name: Validate test inputs
        run: |
          set -euxo pipefail
          case "$TEST_ID" in *..*|*/*|*\*) exit 1;; esac
          case "$SOURCE" in efi/*.c) ;; *) exit 1;; esac
          test -f "$SOURCE"

      - name: Checkout GNU-EFI
        uses: actions/checkout@v4
        with:
          repository: ncroxon/gnu-efi
          path: gnu-efi
          ref: master

      - name: Build GNU-EFI
        run: make -C gnu-efi ARCH=x86_64

      - name: Locate GNU-EFI
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/gnu-efi"
          test -f "$ROOT/gnuefi/elf_x86_64_efi.lds"
          CRT=$(find "$ROOT" -type f -name 'crt0-efi-x86_64.o' -print -quit)
          LIBEFI=$(find "$ROOT" -type f -name 'libefi.a' -print -quit)
          LIBGNUEFI=$(find "$ROOT" -type f -name 'libgnuefi.a' -print -quit)
          INC=$(find "$ROOT" -type f -path '*/inc/efi.h' -print -quit)
          test -n "$CRT"; test -n "$LIBEFI"; test -n "$LIBGNUEFI"; test -n "$INC"
          echo "GNUEFI_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "GNUEFI_CRT=$CRT" >> "$GITHUB_ENV"
          echo "GNUEFI_LIBEFI=$LIBEFI" >> "$GITHUB_ENV"
          echo "GNUEFI_LIBGNUEFI=$LIBGNUEFI" >> "$GITHUB_ENV"
          echo "GNUEFI_INC=$(dirname "$INC")" >> "$GITHUB_ENV"

      - name: Record build provenance
        run: |
          set -u
          mkdir -p "build/$TEST_ID"
          if ! BUILD_SHA="$(git rev-parse HEAD)"; then exit 1; fi
          if [ "$BUILD_SHA" != "$GITHUB_SHA" ]; then
            echo "ERROR: checkout commit does not match GITHUB_SHA." >&2
            exit 1
          fi
          if ! git ls-files --error-unmatch -- "$SOURCE" >/dev/null 2>&1; then
            echo "ERROR: source file is not tracked by Git: $SOURCE" >&2
            exit 1
          fi
          if ! EFI_COMMIT="$(git log -1 --format=%H -- "$SOURCE")"; then exit 1; fi
          if [ -z "$EFI_COMMIT" ]; then exit 1; fi
          printf 'BUILD_COMMIT=%s\nEFI_COMMIT=%s\nSOURCE_PATH=%s\nTEST_ID=%s\n' \
            "$BUILD_SHA" "$EFI_COMMIT" "$SOURCE" "$TEST_ID" > "build/$TEST_ID/BUILD-PROVENANCE.txt"
          cat "build/$TEST_ID/BUILD-PROVENANCE.txt"

      - name: Compile
        run: |
          set -euxo pipefail
          gcc -I"$GNUEFI_INC" -I"$GNUEFI_INC/x86_64" -I"$GNUEFI_INC/protocol" \
            -fpic -ffreestanding -fno-stack-protector -fno-stack-check \
            -fshort-wchar -mno-red-zone -maccumulate-outgoing-args \
            -DEFI_FUNCTION_WRAPPER -Wall -Wextra -Os \
            -c "$SOURCE" -o "build/$TEST_ID/test.o"

      - name: Link
        run: |
          set -euxo pipefail
          ld -shared -Bsymbolic -nostdlib -znocombreloc \
            -L"$(dirname "$GNUEFI_LIBEFI")" -L"$(dirname "$GNUEFI_LIBGNUEFI")" \
            -T"$GNUEFI_ROOT/gnuefi/elf_x86_64_efi.lds" \
            "$GNUEFI_CRT" "build/$TEST_ID/test.o" \
            -o "build/$TEST_ID/BOOTX64-$TEST_ID.elf" -lgnuefi -lefi

      - name: Convert and verify EFI
        run: |
          set -euxo pipefail
          objcopy -j .text -j .sdata -j .data -j .rodata -j .dynamic -j .dynsym \
            -j .rel -j .rela -j .rel.* -j .rela.* -j .reloc \
            --output-target=efi-app-x86_64 --subsystem=10 \
            "build/$TEST_ID/BOOTX64-$TEST_ID.elf" "build/$TEST_ID/BOOTX64.EFI"
          file "build/$TEST_ID/BOOTX64.EFI"
          objdump -h "build/$TEST_ID/BOOTX64.EFI"
          test -s "build/$TEST_ID/BOOTX64.EFI"

      - name: Prepare artifact
        run: |
          set -euxo pipefail
          mkdir -p "artifact/EFI-$TEST_ID"
          cp "build/$TEST_ID/BOOTX64.EFI" "artifact/EFI-$TEST_ID/BOOTX64.EFI"
          cp "build/$TEST_ID/BUILD-PROVENANCE.txt" "artifact/EFI-$TEST_ID/BUILD-PROVENANCE.txt"
          test -s "artifact/EFI-$TEST_ID/BOOTX64.EFI"
          test -s "artifact/EFI-$TEST_ID/BUILD-PROVENANCE.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: EFI-${{ env.TEST_ID }}
          path: artifact/EFI-${{ env.TEST_ID }}
          if-no-files-found: error
