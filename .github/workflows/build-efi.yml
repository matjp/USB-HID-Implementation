name: Build EFI Test

on:
  push:
    branches: [main]
    paths:
      - 'efi/**
  workflow_dispatch:
    inputs:
      test_id:
        description: "Artifact/test identifier"
        required: true
        default: "v24"
        type: string
      source:
        description: "EFI C source path"
        required: true
        default: "efi/xhci_mmio_v24.c"
        type: string
      label:
        description: "Human-readable test label"
        required: true
        default: "xHCI V24 / HALT THEN HOST CONTROLLER RESET"
        type: string
      verify1:
        description: "First string to require"
        required: true
        default: "xHCI V24"
        type: string
      verify2:
        description: "Second string to require"
        required: true
        default: "V24 COMPLETE"
        type: string
      verify3:
        description: "Third string to require"
        required: true
        default: "NO DMA"
        type: string

concurrency:
  group: build-efi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Build ') }}
    name: Build EFI test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEST_ID: ${{ inputs.test_id || 'v24' }}
      SOURCE: ${{ inputs.source || 'efi/xhci_mmio_v24.c' }}
      LABEL: ${{ inputs.label || 'xHCI V24 / HALT THEN HOST CONTROLLER RESET' }}
      VERIFY1: ${{ inputs.verify1 || 'xHCI V24' }}
      VERIFY2: ${{ inputs.verify2 || 'V24 COMPLETE' }}
      VERIFY3: ${{ inputs.verify3 || 'NO DMA' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc binutils file

      - name: Validate test inputs
        run: |
          set -euxo pipefail
          case "$TEST_ID" in *..*|*/*|*\*) exit 1;; esac
          case "$SOURCE" in efi/*.c) ;; *) exit 1;; esac
          test -f "$SOURCE"

      - name: Checkout GNU-EFI
        uses: actions/checkout@v4
        with:
          repository: ncroxon/gnu-efi
          path: gnu-efi
          ref: master

      - name: Build GNU-EFI
        run: make -C gnu-efi ARCH=x86_64

      - name: Locate GNU-EFI
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE/gnu-efi"
          test -f "$ROOT/gnuefi/elf_x86_64_efi.lds"
          CRT=$(find "$ROOT" -type f -name 'crt0-efi-x86_64.o' -print -quit)
          LIBEFI=$(find "$ROOT" -type f -name 'libefi.a' -print -quit)
          LIBGNUEFI=$(find "$ROOT" -type f -name 'libgnuefi.a' -print -quit)
          INC=$(find "$ROOT" -type f -path '*/inc/efi.h' -print -quit)
          test -n "$CRT"; test -n "$LIBEFI"; test -n "$LIBGNUEFI"; test -n "$INC"
          echo "GNUEFI_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "GNUEFI_CRT=$CRT" >> "$GITHUB_ENV"
          echo "GNUEFI_LIBEFI=$LIBEFI" >> "$GITHUB_ENV"
          echo "GNUEFI_LIBGNUEFI=$LIBGNUEFI" >> "$GITHUB_ENV"
          echo "GNUEFI_INC=$(dirname "$INC")" >> "$GITHUB_ENV"

      - name: Compile
        run: |
          set -euxo pipefail
          mkdir -p "build/$TEST_ID"
          gcc -I"$GNUEFI_INC" -I"$GNUEFI_INC/x86_64" -I"$GNUEFI_INC/protocol"             -fpic -ffreestanding -fno-stack-protector -fno-stack-check             -fshort-wchar -mno-red-zone -maccumulate-outgoing-args             -DEFI_FUNCTION_WRAPPER -Wall -Wextra -Os             -c "$SOURCE" -o "build/$TEST_ID/test.o"

      - name: Link
        run: |
          set -euxo pipefail
          ld -shared -Bsymbolic -nostdlib -znocombreloc             -L"$(dirname "$GNUEFI_LIBEFI")" -L"$(dirname "$GNUEFI_LIBGNUEFI")"             -T"$GNUEFI_ROOT/gnuefi/elf_x86_64_efi.lds"             "$GNUEFI_CRT" "build/$TEST_ID/test.o"             -o "build/$TEST_ID/BOOTX64-$TEST_ID.elf" -lgnuefi -lefi

      - name: Convert and verify EFI
        run: |
          set -euxo pipefail
          objcopy -j .text -j .sdata -j .data -j .rodata -j .dynamic -j .dynsym             -j .rel -j .rela -j .rel.* -j .rela.* -j .reloc             --output-target=efi-app-x86_64 --subsystem=10             "build/$TEST_ID/BOOTX64-$TEST_ID.elf" "build/$TEST_ID/BOOTX64.EFI"
          file "build/$TEST_ID/BOOTX64.EFI"
          objdump -h "build/$TEST_ID/BOOTX64.EFI"
          strings -el "build/$TEST_ID/BOOTX64.EFI" | grep -F "$VERIFY1"
          strings -el "build/$TEST_ID/BOOTX64.EFI" | grep -F "$VERIFY2"
          strings -el "build/$TEST_ID/BOOTX64.EFI" | grep -F "$VERIFY3"
          test -s "build/$TEST_ID/BOOTX64.EFI"

      - name: Prepare artifact
        run: |
          set -euxo pipefail
          cp "build/$TEST_ID/BOOTX64.EFI" BOOTX64.EFI
          test -s BOOTX64.EFI

      - uses: actions/upload-artifact@v4
        with:
          name: EFI-${{ env.TEST_ID }}
          path: BOOTX64.EFI
          if-no-files-found: error
