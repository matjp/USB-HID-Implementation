name: V32 one-time fix

on:
  push:
    branches: [temp/v32-fix-workflow]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch V32 source
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('efi/xhci_mmio_v32.c')
          s = p.read_text()
          old = '''    saved_rflags = v32_disable_cpu_interrupts();
    cpu_interrupts_disabled = TRUE;

    s = v32_validate_controller_path(controller, &b.controller_path);
    if (EFI_ERROR(s)) { v32_fail(u"BIND", u"CONTROLLER PATH", s); goto out; }

    s = v32_pci_match(controller, b.pci_segment, b.pci_bus,
'''
          new = '''    saved_rflags = v32_disable_cpu_interrupts();
    cpu_interrupts_disabled = TRUE;

    /* The UEFI-selected controller handle is the binding identity. The exact
       controller path is retained in the handoff, but is not reopened after
       DisconnectController(). The fresh bridge binds the supplied handle. */
    s = v32_pci_match(controller, b.pci_segment, b.pci_bus,
'''
          if s.count(old) != 1:
              raise SystemExit('expected V32 binding block not found exactly once')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- efi/xhci_mmio_v32.c
      - name: Commit source change and remove this workflow
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v32-fix-once.yml
          git add efi/xhci_mmio_v32.c
          git commit -m 'Fix V32 post-disconnect controller path validation'
          git push origin HEAD:temp/v32-fix-workflow
