name: Diagnose V32 port reset
on:
  push:
    paths:
      - ".github/workflows/diagnose-v32-port-reset.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch temporary V32 diagnostics
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('efi/xhci_mmio_v32.c')
          s = p.read_text()
          old = '#define V32_USB_SPEED_LOW           1U\n#define V32_USB_SPEED_FULL          2U'
          new = '#define V32_USB_SPEED_FULL          1U\n#define V32_USB_SPEED_LOW           2U'
          if old in s:
              s = s.replace(old, new, 1)
          old = '''    s = v32_portsc_write(p, portsc_off, status, V32_PORTSC_PR, 0, 0, &writes);\n    if (EFI_ERROR(s)) goto out;\n    Print(u"PORT RESET: ASSERTED / WAITING\\r\\n");\n    s = v32_wait_event(p, ir + 0x18U, &ev_d, V32_TRB_PORT_STATUS_CHANGE,\n'''
          new = '''    s = v32_portsc_write(p, portsc_off, status, V32_PORTSC_PR, 0, 0, &writes);\n    if (EFI_ERROR(s)) goto out;\n    {\n        UINT32 after_reset = 0;\n        s = mr32(p, portsc_off, &after_reset); ++reads;\n        if (EFI_ERROR(s)) goto out;\n        Print(u"RESET OBSERVE: PR=%u PRC=%u PED=%u PLS=%u SPEED=%u\\r\\n",\n              (after_reset & V32_PORTSC_PR) ? 1U : 0U,\n              (after_reset & V32_PORTSC_PRC) ? 1U : 0U,\n              (after_reset & V32_PORTSC_PED) ? 1U : 0U,\n              (after_reset & V32_PORTSC_PLS_MASK) >> 5,\n              (after_reset & V32_PORTSC_SPEED_MASK) >> V32_PORTSC_SPEED_SHIFT);\n        {\n            volatile UINT32 *ev = (volatile UINT32 *)ev_d.host;\n            Print(u"EVENT[0]: %08x %08x %08x %08x\\r\\n", ev[0], ev[1], ev[2], ev[3]);\n        }\n    }\n    Print(u"PORT RESET: ASSERTED / WAITING\\r\\n");\n    s = v32_wait_event(p, ir + 0x18U, &ev_d, V32_TRB_PORT_STATUS_CHANGE,\n'''
          if old not in s:
              raise SystemExit('reset diagnostic pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git add efi/xhci_mmio_v32.c
          git commit -m "Diagnose V32 port reset event delivery"
          git push
      - name: Verify project boundary
        run: |
          set -euxo pipefail
          grep -q 'static EFI_STATUS v32_produce_handoff' efi/xhci_mmio_v32.c
          grep -q 'RESET OBSERVE:' efi/xhci_mmio_v32.c
          test "$(grep -c 'LibLocateHandle(ByProtocol, &V32_UsbIoGuid' efi/xhci_mmio_v32.c || true)" = 1
      - name: Remove helper
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/diagnose-v32-port-reset.yml
          git add .github/workflows/diagnose-v32-port-reset.yml
          git commit -m "Remove temporary V32 diagnostic workflow"
          git push
