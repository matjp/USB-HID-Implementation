name: Repair V32 device path

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch V32 diagnostics and port mapping
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('efi/xhci_mmio_v32.c')
          s = p.read_text()

          if 'DP ROOT=' not in s:
              old = '        root = v32_root_port(path, &nodes);\n        if (nodes != 1U) {'
              new = '''        root = v32_root_port(path, &nodes);\n        Print(u"DP ROOT=%u USB-NODES=%u FIRST-TYPE=%02x FIRST-SUB=%02x FIRST-LEN=%u\\r\\n",\n              root, nodes, path ? ((UINT8 *)path)[0] : 0,\n              path ? ((UINT8 *)path)[1] : 0,\n              path ? (UINT16)((UINT8 *)path)[2] | ((UINT16)((UINT8 *)path)[3] << 8) : 0);\n        if (nodes != 1U) {'''
              if old not in s: raise SystemExit('discovery marker not found')
              s = s.replace(old, new, 1)

          if 'DP USB NODE:' not in s:
              old = '            root = p[4];\n            ++count;'
              new = '            root = p[4];\n            ++count;\n            Print(u"DP USB NODE: PORT=%u IF=%u\\r\\n", p[4], p[5]);'
              if old not in s: raise SystemExit('parser marker not found')
              s = s.replace(old, new, 1)

          if s.count('UINT8 xhci_port = 0U;') == 0:
              old = 'UINT32 portsc_off;'
              if old not in s: raise SystemExit('port declaration not found')
              s = s.replace(old, 'UINT32 portsc_off;\n    UINT8 xhci_port = 0U;', 1)

          old = '''    portsc_off = op + 0x400U + ((UINT32)xhci_port - 1U) * 0x10U;\n    s = mr32(p, portsc_off, &status); ++reads; if (EFI_ERROR(s)) goto out;\n    if (!(status & V32_PORTSC_CCS)) { s = EFI_NOT_FOUND; v32_fail(u"PORT", u"NOT CONNECTED", s); goto out; }\n    speed = (UINT8)((status & V32_PORTSC_SPEED_MASK) >> V32_PORTSC_SPEED_SHIFT);\n    if (speed != V32_USB_SPEED_LOW && speed != V32_USB_SPEED_FULL) { s = EFI_UNSUPPORTED; v32_fail(u"PORT", u"LS/FS ONLY", s); goto out; }\n    if (b.keyboard.root_port == 0xffU) { s = EFI_UNSUPPORTED; v32_fail(u"PORT", u"ROOT PORT NUMBER", s); goto out; }\n    xhci_port = (UINT8)(b.keyboard.root_port + 1U);\n    s = v32_supported_protocol(p, hcc, xhci_port, &proto_major, &proto_minor, &slot_type, &reads); if (EFI_ERROR(s)) { v32_fail(u"PORT", u"SUPPORTED PROTOCOL", s); goto out; }'''
          new = '''    if (b.keyboard.root_port == 0xffU) { s = EFI_UNSUPPORTED; v32_fail(u"PORT", u"ROOT PORT NUMBER", s); goto out; }\n    xhci_port = (UINT8)(b.keyboard.root_port + 1U);\n    s = v32_supported_protocol(p, hcc, xhci_port, &proto_major, &proto_minor, &slot_type, &reads); if (EFI_ERROR(s)) { v32_fail(u"PORT", u"SUPPORTED PROTOCOL", s); goto out; }\n    portsc_off = op + 0x400U + ((UINT32)xhci_port - 1U) * 0x10U;\n    s = mr32(p, portsc_off, &status); ++reads; if (EFI_ERROR(s)) goto out;\n    if (!(status & V32_PORTSC_CCS)) { s = EFI_NOT_FOUND; v32_fail(u"PORT", u"NOT CONNECTED", s); goto out; }\n    speed = (UINT8)((status & V32_PORTSC_SPEED_MASK) >> V32_PORTSC_SPEED_SHIFT);\n    if (speed != V32_USB_SPEED_LOW && speed != V32_USB_SPEED_FULL) { s = EFI_UNSUPPORTED; v32_fail(u"PORT", u"LS/FS ONLY", s); goto out; }'''
          if old not in s: raise SystemExit('port mapping block not found')
          s = s.replace(old, new, 1)

          if 'PORT: UEFI=' not in s:
              old = 'Print(u"PORT=%u CONNECTED SPEED=%u PROTOCOL=%u.%u SLOT-TYPE=%u\\r\\n",\n          b.keyboard.root_port, speed, proto_major, proto_minor, slot_type);'
              new = 'Print(u"PORT: UEFI=%u XHCI=%u CONNECTED SPEED=%u PROTOCOL=%u.%u SLOT-TYPE=%u\\r\\n",\n          b.keyboard.root_port, xhci_port, speed, proto_major, proto_minor, slot_type);'
              if old not in s: raise SystemExit('port print marker not found')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          git diff --check

      - name: Commit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-v32-device-path.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add efi/xhci_mmio_v32.c .github/workflows/repair-v32-device-path.yml
          git commit -m 'Add V32 device-path diagnostics and fix port mapping'
          git push origin HEAD:main

      - name: Dispatch EFI build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-efi.yml/dispatches" \
            -d '{"ref":"main"}'
